<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("horaires").textContent);
  var ICONE = '<svg viewBox="0 0 64 64" aria-hidden="true">' +
    '<rect x="14" y="8" width="36" height="40" rx="9" fill="#fff"/>' +
    '<rect x="19" y="14" width="26" height="15" rx="3" fill="#1d2b44"/>' +
    '<rect x="29" y="11" width="6" height="2" rx="1" fill="#1d2b44"/>' +
    '<circle cx="22" cy="38" r="3" fill="#1d2b44"/><circle cx="42" cy="38" r="3" fill="#1d2b44"/>' +
    '<path d="M20 48 L14 57 M44 48 L50 57" stroke="#fff" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M17 54 H47" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>';

  function deux(n) { return (n < 10 ? "0" : "") + n; }
  function hhmm(d) { return deux(d.getHours()) + ":" + deux(d.getMinutes()); }
  function cle(d) { return "" + d.getFullYear() + deux(d.getMonth() + 1) + deux(d.getDate()); }
  function dateFr(k) { return k ? k.substr(6, 2) + "/" + k.substr(4, 2) + "/" + k.substr(0, 4) : "?"; }
  function echapper(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // « Roubaix Roubaix Grand Place » -> « Roubaix Grand Place » ; « Lomme Lomme-Lambersart » -> « Lomme-Lambersart »
  function court(dest) {
    var m = dest.split(" ");
    return (m.length > 1 && m[1].indexOf(m[0]) === 0) ? m.slice(1).join(" ") : dest;
  }

  // Prochains passages au quai, à partir de « maintenant ». Même calcul que next_metro.py :
  // une rame de 00h30 appartient au jour de service de la veille (heure « 24:30 » dans le fichier).
  function prochainsPassages(quai, maintenant, nombre) {
    var res = [], off, jour, grille, parDest, dest, liste, i, t;
    for (off = -1; off <= 1; off++) {
      jour = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate() + off);
      grille = DATA.dates[cle(jour)];
      if (grille === undefined) continue;
      parDest = DATA.grilles[grille][quai] || {};
      for (dest in parDest) {
        if (!parDest.hasOwnProperty(dest)) continue;
        liste = parDest[dest];
        for (i = 0; i < liste.length; i++) {
          t = new Date(jour.getFullYear(), jour.getMonth(), jour.getDate(), 0, 0, liste[i]);
          if (t.getTime() >= maintenant.getTime()) res.push({ heure: t, destination: court(dest) });

      }
    }
    res.sort(function (a, b) { return a.heure.getTime() - b.heure.getTime(); });
    return res.slice(0, nombre || 3);
  }
  window.prochainsPassages = prochainsPassages; // pour les tests

  function attente(p, maintenant) {
    var ms = p.heure.getTime() - maintenant.getTime();
    if (ms < 60000) return "Imminent"; 
    var min = Math.floor(ms / 60000);
    return min >= 60 ? "à " + hhmm(p.heure) : min + " min";
  }

  var jours = Object.keys(DATA.dates).sort();
  var dernierJour = jours[jours.length - 1];
  var quais = Object.keys(DATA.sens).sort(); // CXM098 (Tourcoing) puis CXM099 (Lomme)
  var choix = (/[?&]sens=([^&]+)/.exec(location.search) || [])[1];
  if (choix) {
    choix = decodeURIComponent(choix).toLowerCase();
    var filtres = quais.filter(function (q) { return DATA.sens[q].toLowerCase().indexOf(choix) >= 0; });
    if (filtres.length) quais = filtres;
  }
  if (quais.length === 1) document.body.className = "seul";

  function ecran(quai, maintenant) {
    var direction = court(DATA.sens[quai]);
    var passages = prochainsPassages(quai, maintenant, 3);
    var perime = cle(maintenant) > dernierJour;
    var milieu;
    if (!passages.length) {
      milieu = '<div class="libelle">Prochain métro</div><div class="attente">' +
        (perime ? "Horaires à mettre à jour" : "Pas de métro") + '</div><div class="suivant">' +
        (perime ? "Horaires valables jusqu'au " + dateFr(dernierJour) : "Fin de service") + "</div>";
    } else {
      var p = passages[0], s = passages[1];
      milieu = '<div class="libelle">Prochain métro</div><div class="attente">' + attente(p, maintenant) + "</div>" +
        (p.destination !== direction ? '<div class="terminus">Terminus ' + echapper(p.destination) + "</div>" : "") +
        (s ? '<div class="suivant">Suivant : ' + attente(s, maintenant) +

    }
    return '<div class="ecran' + (passages.length ? "" : " vide") + '">' +
      '<div class="haut"><span class="badge">' + echapper(DATA.ligne) + '</span>' +
      '<span class="direction">Direction <b>' + echapper(direction) + "</b></span></div>" +
      '<div class="milieu"><div class="icone">' + ICONE + "</div><div>" + milieu + "</div></div>" +
      '<div class="bas"><span class="heure">' + hhmm(maintenant) + '</span><span class="station">' +
      echapper(DATA.station) + '</span><span class="note">Horaires théoriques</span></div></div>';
  }

  function afficher() {
    var maintenant = new Date();
    document.getElementById("ecrans").innerHTML =

  }

    var f = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (f && !(document.fullscreenElement || document.webkitFullscreenElement)) f.call(el);
  }
  document.addEventListener("click", pleinEcran);
  document.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.keyCode === 13) pleinEcran(); });

  afficher();
  setInterval(afficher, 5000);
})();
</script>
